onboarding = false

[keys]
prefix = "ctrl+a"

# toggle side bar
toggle_sidebar = "prefix+e"

# Tab cycling: Ctrl+A then h/l OR rapid fire with Ctrl+Alt+h/l
previous_tab = "prefix+h"
next_tab     = "prefix+l"

# Pane focus: Ctrl+A then j/k for left/right
focus_pane_left  = "prefix+j"
# focus_pane_right = "prefix+k"

# Tab/Pane management
new_tab = "prefix+c"
close_tab = "prefix+x"
close_pane = "prefix+shift+x"

# Pane layout
split_vertical = "prefix+v"
split_horizontal = "prefix+minus"

# Resize and navigation modes
resize_mode = "prefix+m"
next_agent = "prefix+tab"
previous_agent = "prefix+shift+tab"

# Workspace navigation
previous_workspace = "prefix+["
next_workspace = "prefix+]"

# Disable defaults that collide with the above
focus_pane_down = ""
focus_pane_up   = ""

[[keys.command]]
key = "prefix+p"
type = "popup"
command = "nu ~/.config/herdr/scripts/pick-project.nu"
description = "switch project"

[[keys.command]]
key = "prefix+r"
type = "shell"
command = "herdr server reload-config"
description = "reload herdr config"

[[keys.command]]
key = "ctrl+tab"
type = "shell"
command = "nu ~/.config/herdr/scripts/tab-toggle.nu"
description = "toggle to previously focused tab"

[[keys.command]]
key = "prefix+k"
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"

[theme]
name = "tokyo-night"
auto_switch = true
light_name = "tokyo-night-day"
dark_name = "tokyo-night"

[terminal]
default_shell = "nu"
new_cwd = "follow"

[ui]
host_cursor = "native"
agent_panel_sort = "spaces"
tab_bar_position = "bottom"
sidebar_start_collapsed = true
sidebar_collapsed_mode = "compact"
show_agent_labels_on_pane_borders = true

tab_bar_right = [
  { type = "zoom" },
  { type = "hostname" },
]
tab_bar_right_separator = " · "

status_indicators = "symbols"
window_title = "{hostname}: {workspace}"

[ui.sidebar.agents]
row_gap = 0
rows = [
    ["state_icon", "agent"],
    ["terminal_title_stripped"],
    ["workspace", "tab"]
]

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[session]
resume_agents_on_restore = true
